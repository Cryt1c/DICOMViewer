@if (data() && data().length > 0) {
  <mat-tree #tree [dataSource]="data()" [childrenAccessor]="childrenAccessor">
    <mat-tree-node *matTreeNodeDef="let node" matTreeNodePadding>
      {{ node.type }}:
      @if (selectedKey() === node.key) {
        <button
          mat-stroked-button
          (click)="handleNodeClick(node.key)">
          {{ node.label }}
        </button>
      }
      @else {
        <button mat-button (click)="handleNodeClick(node.key)">
          {{ node.label }}
        </button>
      }
    </mat-tree-node>
    <mat-tree-node
      *matTreeNodeDef="let node; when: hasChild"
      matTreeNodePadding
      matTreeNodeToggle
      [cdkTreeNodeTypeaheadLabel]="node.label">
      {{ node.type }}:<button
        mat-icon-button
        matTreeNodeToggle
        [attr.aria-label]="'Toggle ' + node.label">
        <mat-icon class="mat-icon-rtl-mirror">
          {{ tree.isExpanded(node) ? 'expand_more' : 'chevron_right' }}
        </mat-icon>
      </button>
      {{ node.label }}
    </mat-tree-node>
  </mat-tree>
}
