name: Deploy PR preview to GH Pages

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write # push preview commits to the gh-pages branch
  pull-requests: write # post/update the preview link comment

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true # a new push supersedes the previous preview run

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    env:
      PREVIEW_URL: https://cryt1c.github.io/DICOMViewer/${{ github.event.pull_request.number }}/
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v3
        with:
          node-version: 22
          cache: 'npm'
      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci
      - run: npm i wasm-pack
      - name: Build with PR preview base href
        run: npx nx run dicom-viewer:build -- --base-href=$PREVIEW_URL
      - uses: actions/upload-artifact@v4
        with:
          name: pr-preview-dist
          path: dist/dicom-viewer/browser

  deploy:
    needs: build
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false # serialize pushes to the gh-pages branch
    steps:
      - uses: actions/setup-node@v3
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: pr-preview-dist
          path: dist/dicom-viewer/browser
      - name: Configure git identity
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "github-actions@github.com"
      - name: Publish preview to gh-pages/<PR number>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # gh-pages caches its gh-pages clone via find-cache-dir, which
          # requires an npm context; point it at a plain temp dir instead.
          CACHE_DIR: /tmp/gh-pages-deploy-cache
        run: |
          npx --yes gh-pages@6.3.0 \
            --dist dist/dicom-viewer/browser \
            --dest "$PR_NUMBER" \
            --repo "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" \
            --message "PR #${PR_NUMBER} preview (deploy #${{ github.run_number }})"
      - name: Post or update preview comment
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: https://cryt1c.github.io/DICOMViewer/${{ github.event.pull_request.number }}/
        run: |
          MARKER='<!-- pr-preview-comment -->'
          BODY=$(printf '**PR preview:** %s\n\n_Auto-updated on every push to this PR._\n\n%s' "$PREVIEW_URL" "$MARKER")
          PAYLOAD=$(jq -n --arg body "$BODY" '{body: $body}')
          comment_id=$(curl -sf -H "Authorization: Bearer $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments?per_page=100" \
            | jq -r --arg marker "$MARKER" '[.[] | select(.body | contains($marker))][0].id // empty')
          if [ -n "$comment_id" ]; then
            curl -sf -X PATCH -H "Authorization: Bearer $GITHUB_TOKEN" -d "$PAYLOAD" \
              "https://api.github.com/repos/$REPO/issues/comments/$comment_id" > /dev/null
          else
            curl -sf -X POST -H "Authorization: Bearer $GITHUB_TOKEN" -d "$PAYLOAD" \
              "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" > /dev/null
          fi

  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    steps:
      - name: Remove preview directory from gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" pages
          cd pages
          git config user.name "GitHub Actions"
          git config user.email "github-actions@github.com"
          if [ ! -d "$PR_NUMBER" ]; then
            echo "No preview directory for PR #$PR_NUMBER; nothing to remove."
            exit 0
          fi
          git rm -rf "$PR_NUMBER"
          git commit -m "Remove PR #${PR_NUMBER} preview (PR closed)"
          git push
